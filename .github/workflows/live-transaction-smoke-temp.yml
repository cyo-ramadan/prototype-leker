name: TEMP Live Transaction API Smoke

on:
  push:
    branches:
      - agent/governance-live-transaction-smoke-20260816
    paths:
      - .github/workflows/live-transaction-smoke-temp.yml
      - scripts/live-expense-smoke-temp.mjs

permissions:
  contents: read

jobs:
  live-transaction-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Execute API-only EXPENSE and verify Accounting journal
        run: node scripts/live-expense-smoke-temp.mjs
