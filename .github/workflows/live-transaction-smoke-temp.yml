name: TEMP Live Transaction API Smoke

on:
  push:
    branches:
      - agent/governance-live-transaction-smoke-20260816
    paths:
      - .github/workflows/live-transaction-smoke-temp.yml
      - scripts/live-accounting-journal-audit-temp.mjs

permissions:
  contents: read

jobs:
  live-transaction-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Audit live Accounting Data Jurnal and journal detail
        run: node scripts/live-accounting-journal-audit-temp.mjs
