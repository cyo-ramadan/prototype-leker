city=".15" stroke="#2a8a3a"/><text x="1089.0" y="303" font-size="13" fill="#2a8a3a" text-anchor="middle" font-weight="700">GPIO4</text><text x="1000" y="395" font-size="12" fill="#2a8a3a" text-anchor="middle" font-weight="400">+ pull-up 100k ke 3V3</text><polyline points="1290,90 1290,170" fill="none" stroke="#222" stroke-width="2.2"/><circle cx="1290" cy="205" r="34" fill="#fff4c2" stroke="#222" stroke-width="2"/><path d="M1266,181 L1314,229 M1314,181 L1266,229" stroke="#222" stroke-width="2"/><text x="1290" y="258" font-size="14" fill="#222" text-anchor="middle" font-weight="700">BOHLAM</text><polyline points="1290,239 1290,340" fill="none" stroke="#222" stroke-width="2.2"/><circle cx="1290" cy="290" r="5" fill="#222"/><rect x="1250" y="340" width="110" height="100" rx="7" fill="#fff" stroke="#222" stroke-width="2"/><text x="1305.0" y="369.5" text-anchor="middle" font-size="15" font-weight="700">TRIAC</text><text x="1305.0" y="386.5" text-anchor="middle" font-size="13" font-weight="400">Z0109MN</text><text x="1305.0" y="403.5" text-anchor="middle" font-size="13" font-weight="400">SOT-223</text><text x="1305.0" y="420.5" text-anchor="middle" font-size="13" font-weight="400">MT2 atas</text><polyline points="1305,440 1305,560" fill="none" stroke="#222" stroke-width="2.2"/><circle cx="1305" cy="560" r="5" fill="#222"/><polyline points="1290,560 1305,560" fill="none" stroke="#222" stroke-width="2.2"/><text x="1312" y="470" font-size="12" fill="#555" text-anchor="start" font-weight="400">MT1</text><polyline points="1290,290 1170,290 1170,320" fill="none" stroke="#222" stroke-width="2.2"/><text x="1230" y="284" font-size="12" fill="#555" text-anchor="middle" font-weight="400">330Ω</text><rect x="1115" y="320" width="115" height="95" rx="7" fill="#fff" stroke="#222" stroke-width="2"/><text x="1172.5" y="347.0" text-anchor="middle" font-size="15" font-weight="700">OK2</text><text x="1172.5" y="364.0" text-anchor="middle" font-size="13" font-weight="400">MOC3023S</text><text x="1172.5" y="381.0" text-anchor="middle" font-size="13" font-weight="400">SMD-6</text><text x="1172.5" y="398.0" text-anchor="middle" font-size="13" font-weight="400">1k GATE–MT1</text><polyline points="1230,395 1250,395" fill="none" stroke="#222" stroke-width="2.2"/><text x="1240" y="388" font-size="12" fill="#555" text-anchor="middle" font-weight="400">G</text><polyline points="1172,415 1172,450" fill="none" stroke="#222" stroke-width="2.2"/><rect x="1115" y="450" width="115" height="75" rx="7" fill="#fff" stroke="#222" stroke-width="2"/><text x="1172.5" y="475.5" text-anchor="middle" font-size="15" font-weight="700">Q1 MMBT3904</text><text x="1172.5" y="492.5" text-anchor="middle" font-size="13" font-weight="400">LED: 3V3–150Ω</text><text x="1172.5" y="509.5" text-anchor="middle" font-size="13" font-weight="400">basis 4k7</text><polyline points="1172,525 1172,540" fill="none" stroke="#b5651d" stroke-width="2.2"/><rect x="1135" y="533" width="70" height="22" rx="11" fill="#b5651d" opacity=".15" stroke="#b5651d"/><text x="1170.0" y="549" font-size="13" fill="#b5651d" text-anchor="middle" font-weight="700">← GPIO5</text><rect x="560" y="640" width="400" height="120" rx="7" fill="#fff" stroke="#222" stroke-width="2"/><text x="760.0" y="688.0" text-anchor="middle" font-size="15" font-weight="700">ESP8285 (modul ESP-M3 ±12×16 mm)</text><text x="760.0" y="705.0" text-anchor="middle" font-size="13" font-weight="400">antena di ujung atas, jauh dari ulir kuningan E27</text><text x="760.0" y="722.0" text-anchor="middle" font-size="13" font-weight="400">firmware v1.0.0</text><rect x="470" y="652" width="38" height="22" rx="11" fill="#7a3fb0" opacity=".15" stroke="#7a3fb0"/><text x="489.0" y="668" font-size="13" fill="#7a3fb0" text-anchor="middle" font-weight="700">3V3</text><polyline points="506,665 560,665" fill="none" stroke="#7a3fb0" stroke-width="2.2"/><rect x="470" y="692" width="38" height="22" rx="11" fill="#333" opacity=".15" stroke="#333"/><text x="489.0" y="708" font-size="13" fill="#333" text-anchor="middle" font-weight="700">GND</text><polyline points="506,705 560,705" fill="none" stroke="#333" stroke-width="2.2"/><rect x="1000" y="652" width="54" height="22" rx="11" fill="#2a8a3a" opacity=".15" stroke="#2a8a3a"/><text x="1027.0" y="668" font-size="13" fill="#2a8a3a" text-anchor="middle" font-weight="700">GPIO4</text><polyline points="960,665 1000,665" fill="none" stroke="#2a8a3a" stroke-width="2.2"/><rect x="1000" y="702" width="54" height="22" rx="11" fill="#b5651d" opacity=".15" stroke="#b5651d"/><text x="1027.0" y="718" font-size="13" fill="#b5651d" text-anchor="middle" font-weight="700">GPIO5</text><polyline points="960,715 1000,715" fill="none" stroke="#b5651d" stroke-width="2.2"/><text x="1080" y="670" font-size="13" fill="#2a8a3a" text-anchor="start" font-weight="400">← dari OK1 (zero-cross)</text><text x="1080" y="720" font-size="13" fill="#b5651d" text-anchor="start" font-weight="400">→ ke Q1 / OK2 (tembak TRIAC)</text><text x="560" y="785" font-size="13" fill="#555" text-anchor="start" font-weight="400">Label berwarna yang namanya sama = tersambung.</text><text x="40" y="838" font-size="14" fill="#333" text-anchor="start" font-weight="400">PCB tegak 22 × 38 mm · penampang total ±22 × 13 mm → muat di casing fitting Ø40 × 65 mm (rongga dalam ≥ 28 mm).</text><text x="40" y="860" font-size="14" fill="#333" text-anchor="start" font-weight="400">Arus catu ±37 mA (198V) – ±45 mA (240V). Kebutuhan ESP rata-rata 20–30 mA; lonjakan WiFi (15 dBm) ditanggung C2.</text><text x="40" y="882" font-size="14" fill="#333" text-anchor="start" font-weight="400">Titik hitam = tersambung. Jarak jalur L–N di PCB ≥ 2,5 mm, beri slot di bawah C1 dan di antara sisi optocoupler.</text><text x="40" y="910" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">⚠ Non-isolasi: SELURUH papan bertegangan PLN walau tertulis 7,5V/3,3V. Jangan disentuh/di-flash saat tercolok.</text></svg>