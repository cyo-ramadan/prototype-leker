name: Bootstrap Accounting Settings group UX revision

on:
  push:
    branches:
      - fix/accounting-settings-group-save-preview

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/accounting-settings-group-save-preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused revision
        run: node scripts/apply-accounting-settings-group-save-preview.mjs
      - name: Run full tests
        run: npm test
      - name: Run syntax checks
        run: npm run check
      - name: Commit validated revision and remove bootstrap artifacts
        shell: bash
        run: |
          rm -- scripts/apply-accounting-settings-group-save-preview.mjs
          rm -- .github/workflows/bootstrap-accounting-settings-group-save-preview.yml
          git config user.name "Karen"
          git config user.email "karen@agent.maxi"
          git add -- public/admin-accounting-settings-comfort.js test/accounting-settings-choice-groups.test.js contracts/accounting-choice-groups-v1.md scripts/apply-accounting-settings-group-save-preview.mjs .github/workflows/bootstrap-accounting-settings-group-save-preview.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "refine Accounting Settings transaction group UX"
          git push origin HEAD:fix/accounting-settings-group-save-preview
