name: TEMP D1 0085 Diagnostic

on:
  push:
    branches: [feat/dermo-leker-subcategories]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preflight remote D1
        shell: bash
        run: |
          set -euo pipefail
          echo '=== pending migrations ==='
          npx --yes wrangler d1 migrations list DB --remote
          echo '=== tagged Dermo Leker count ==='
          npx --yes wrangler d1 execute DB --remote --yes --command "SELECT COUNT(*) AS tagged_leker FROM products p WHERE p.store_id = 'store_dermo' AND EXISTS (SELECT 1 FROM manufacturing_recipes r WHERE r.store_id = p.store_id AND r.output_product_id = p.id AND r.id LIKE 'dermo_leker_recipe_%' AND r.created_by_id = 'migration_0083');"
          echo '=== unexpected tagged prices ==='
          npx --yes wrangler d1 execute DB --remote --yes --command "SELECT p.name, p.price, p.category FROM products p WHERE p.store_id = 'store_dermo' AND EXISTS (SELECT 1 FROM manufacturing_recipes r WHERE r.store_id = p.store_id AND r.output_product_id = p.id AND r.id LIKE 'dermo_leker_recipe_%' AND r.created_by_id = 'migration_0083') AND p.price NOT IN (1500000000,2000000000,3000000000,4000000000,5000000000,8000000000,10000000000,15000000000,20000000000,25000000000,40000000000) ORDER BY p.name;"
          echo '=== reserved child category usage ==='
          npx --yes wrangler d1 execute DB --remote --yes --command "SELECT category, COUNT(*) AS total FROM products WHERE store_id = 'store_dermo' AND category IN ('2K','3K','4K','5K','Special') GROUP BY category ORDER BY category;"
      - name: Export remote D1 backup
        run: npx --yes wrangler d1 export DB --remote --output prototype-leker-db-before-0085.sql
      - name: Apply pending migrations
        run: npx --yes wrangler d1 migrations apply DB --remote
      - name: Verify 0085 remote state
        shell: bash
        run: |
          set -euo pipefail
          echo '=== categories columns ==='
          npx --yes wrangler d1 execute DB --remote --yes --command "PRAGMA table_info(categories);"
          echo '=== Leker hierarchy ==='
          npx --yes wrangler d1 execute DB --remote --yes --command "SELECT child.name, child.display_order, parent.name AS parent_name FROM categories child LEFT JOIN categories parent ON parent.id = child.parent_category_id WHERE child.store_id = 'store_dermo' AND child.name IN ('Leker','2K','3K','4K','5K','Special') ORDER BY child.display_order, child.name;"
          echo '=== tagged Dermo Leker distribution ==='
          npx --yes wrangler d1 execute DB --remote --yes --command "SELECT p.category, COUNT(*) AS total FROM products p WHERE p.store_id = 'store_dermo' AND EXISTS (SELECT 1 FROM manufacturing_recipes r WHERE r.store_id = p.store_id AND r.output_product_id = p.id AND r.id LIKE 'dermo_leker_recipe_%' AND r.created_by_id = 'migration_0083') GROUP BY p.category ORDER BY CASE p.category WHEN '2K' THEN 1 WHEN '3K' THEN 2 WHEN '4K' THEN 3 WHEN '5K' THEN 4 WHEN 'Special' THEN 5 ELSE 99 END;"
          echo '=== latest migration ledger ==='
          npx --yes wrangler d1 execute DB --remote --yes --command "SELECT id, name, applied_at FROM d1_migrations ORDER BY id DESC LIMIT 3;"
