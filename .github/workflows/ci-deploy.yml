name: Prototype Leker CI & Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prototype-leker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply Accounting Settings UX revision
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/accounting-settings-group-save-preview' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/apply-accounting-settings-group-save-preview.mjs ]; then
            python3 -c 'from pathlib import Path; p=Path("scripts/apply-accounting-settings-group-save-preview.mjs"); s=p.read_text(); s=s.replace("${esc(group.code)}", "\\${esc(group.code)}").replace("${esc(option.code)}", "\\${esc(option.code)}"); p.write_text(s)'
            node scripts/apply-accounting-settings-group-save-preview.mjs
          fi

      - name: Syntax check
        run: npm run check

      - name: Regression tests
        run: npm test

      - name: Commit validated revision and remove bootstrap artifacts
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/accounting-settings-group-save-preview' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f scripts/apply-accounting-settings-group-save-preview.mjs ]; then
            exit 0
          fi
          git fetch origin main
          git show origin/main:.github/workflows/ci-deploy.yml > .github/workflows/ci-deploy.yml
          rm -f scripts/apply-accounting-settings-group-save-preview.mjs
          rm -f .github/workflows/bootstrap-accounting-settings-group-save-preview.yml
          rm -f .bootstrap-accounting-settings-group-save-preview
          git config user.name "Karen"
          git config user.email "karen@agent.maxi"
          git add -- public/admin-accounting-settings-comfort.js test/accounting-settings-choice-groups.test.js contracts/accounting-choice-groups-v1.md .github/workflows/ci-deploy.yml scripts/apply-accounting-settings-group-save-preview.mjs .github/workflows/bootstrap-accounting-settings-group-save-preview.yml .bootstrap-accounting-settings-group-save-preview
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "refine Accounting transaction group save UX"
          git push origin HEAD:fix/accounting-settings-group-save-preview

  deploy:
    name: Backup, Migrate & Deploy Cloudflare
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_URL: https://prototype-leker-v2.daily-napkin.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN production secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID production secret"; exit 1; }

      - name: Export remote D1 backup
        run: npx --yes wrangler d1 export DB --remote --output prototype-leker-db-before-deploy.sql

      - name: Preserve D1 backup
        uses: actions/upload-artifact@v4
        with:
          name: prototype-leker-db-before-deploy-${{ github.run_id }}
          path: prototype-leker-db-before-deploy.sql
          retention-days: 30

      - name: Apply D1 migrations
        run: npx --yes wrangler d1 migrations apply DB --remote

      - name: Deploy Worker
        run: npx --yes wrangler deploy

      - name: Verify Accounting deployment
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$WORKER_URL/accounting-settings-boundary.js" |
            grep -q 'node.textContent !== value'
          curl --fail --silent --show-error "$WORKER_URL/admin-accounting-workspace.js" >/dev/null
          status="$(curl --silent --output /tmp/accounting-api.json --write-out '%{http_code}' "$WORKER_URL/api/admin/settings/accounting")"
          test "$status" = "401"
          grep -q 'Login Owner atau Admin Gerai diperlukan' /tmp/accounting-api.json
