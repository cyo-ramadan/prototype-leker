<!doctype html>
<html lang="id">
<head>

  <script>
    (() => {
      const destination = '/s/DERMO/customer?storeLock=DERMO&source=qr-dermo';
      try { localStorage.setItem('lekerCustomerStoreCode', 'DERMO'); } catch {}
      location.replace(destination);
    })();
