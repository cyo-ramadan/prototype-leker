<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Prototype Leker · Kasir (Read-only)</title>
  <link rel="stylesheet" href="/styles.css" />
  <script>window.LEKER_PAGE_CONTEXT = 'cashier-preview';</script>
  <script src="/staff-entry-guard.js"></script>
  <style>
    .preview-topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; background: #111; color: #fff; flex-wrap: wrap; }
    .preview-topbar a { color: #fff; text-decoration: none; border: 1px solid rgba(255,255,255,.4); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
    .preview-banner { background: #fff3cd; color: #664d03; text-align: center; padding: 8px 12px; font-weight: 600; font-size: 13px; letter-spacing: .02em; }
    .preview-wrap { max-width: 960px; margin: 0 auto; padding: 16px; }
    .preview-drawer-card { border: 1px solid #ddd; border-radius: 10px; padding: 14px 16px; margin-bottom: 18px; background: #fafafa; }
    .preview-drawer-card.open { border-color: #16a34a; background: #f0fdf4; }
    .preview-menu-group { margin-bottom: 20px; }
    .preview-menu-group h3 { margin: 0 0 8px; font-size: 15px; color: #555; }
    .preview-menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .preview-menu-item { border: 1px solid #e5e5e5; border-radius: 10px; padding: 10px; }
    .preview-menu-item .name { font-weight: 600; font-size: 14px; }
    .preview-menu-item .price { color: #16a34a; font-weight: 700; margin-top: 4px; }
    #previewMessage { padding: 16px; color: #b91c1c; }
  </style>
</head>
<body>
  <header class="preview-topbar">
    <div><strong id="previewStoreName">Memuat...</strong></div>
    <a id="previewBackLink" href="/entity-admin">← Kembali</a>
  </header>
  <div class="preview-banner">MODE LIHAT · READ-ONLY -- tidak bisa membuat transaksi dari sini</div>
  <main class="preview-wrap">
    <div id="previewMessage" class="hidden"></div>
    <section id="previewDrawer"></section>
    <section id="previewMenu"></section>
  </main>
  <script src="/store-context.js"></script>
  <script src="/cashier-preview.js"></script>
</body>
</html>
