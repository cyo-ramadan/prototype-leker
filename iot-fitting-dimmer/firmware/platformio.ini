; Firmware "Fitting Lampu Pintar" — ESP8285 (ESP8266 + flash 1MB internal)
; Build:  pio run          Upload serial:  pio run -t upload
; OTA lewat browser: http://<ip-lampu>/update  (user: admin, pass: PIN di stiker)

[env:esp8285]
platform = espressif8266
board = esp8285
framework = arduino
board_build.f_cpu = 80000000L
; 1MB tanpa filesystem: sketch ~470KB x2 muat untuk OTA, config pakai EEPROM.
board_build.ldscript = eagle.flash.1m.ld
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@^7.0.4
build_flags =
  -DFW_VERSION=\"1.0.0\"
  -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY

; Modul ESP-12F/ESP-01S (ESP8266 + flash eksternal) untuk prototipe di meja.
[env:esp12]
extends = env:esp8285
board = esp12e
board_build.ldscript = eagle.flash.4m1m.ld
