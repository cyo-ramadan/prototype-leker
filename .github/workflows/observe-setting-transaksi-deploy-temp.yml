name: Observe Setting Transaksi deploy temp

on:
  push:
    branches:
      - chore/observe-setting-transaksi-deploy
    paths:
      - .github/workflows/observe-setting-transaksi-deploy-temp.yml

permissions:
  actions: read
  checks: read
  deployments: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: 26e3d2379abcaa1e589f90b7f11bd0e981f71f95
      TARGET_WORKFLOW: Prototype Leker CI & Deploy
      WORKER_URL: https://prototype-leker-v2.daily-napkin.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/observe-setting-transaksi-deploy
      - name: Observe canonical main deploy and external integrations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${RELEASE_SHA}&event=push&per_page=20")"
          result="$(printf '%s' "$payload" | jq -c --arg wf "$TARGET_WORKFLOW" '[.workflow_runs[] | select(.name == $wf)] | sort_by(.created_at) | last // empty')"
          if [ -z "$result" ]; then
            printf 'release_sha=%s\nstatus=NOT_FOUND\n' "$RELEASE_SHA" > deploy-observation.txt
          else
            printf '%s' "$result" | jq -r --arg sha "$RELEASE_SHA" '
              "release_sha=" + $sha,
              "run_id=" + (.id|tostring),
              "run_number=" + (.run_number|tostring),
              "status=" + .status,
              "conclusion=" + (.conclusion // ""),
              "event=" + .event,
              "workflow=" + .name,
              "html_url=" + .html_url,
              "created_at=" + .created_at,
              "updated_at=" + .updated_at
            ' > deploy-observation.txt
          fi

          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/check-runs?per_page=100" \
            | jq '{total_count, check_runs: [.check_runs[] | {id,name,status,conclusion,details_url,started_at,completed_at,app:(.app.slug // .app.name)}]}' \
            > deploy-check-runs.json

          deployments="$(gh api "/repos/${GITHUB_REPOSITORY}/deployments?sha=${RELEASE_SHA}&per_page=100")"
          printf '%s' "$deployments" | jq '[.[] | {id,sha,ref,task,environment,description,created_at,updated_at,statuses_url}]' > deploy-github-deployments.json
          : > deploy-github-deployment-statuses.jsonl
          for id in $(printf '%s' "$deployments" | jq -r '.[].id'); do
            gh api "/repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses?per_page=100" \
              | jq -c --argjson id "$id" '{deployment_id:$id,statuses:[.[] | {id,state,environment,environment_url,log_url,description,created_at,updated_at}]}' \
              >> deploy-github-deployment-statuses.jsonl
          done
      - name: Smoke live Worker asset
        shell: bash
        run: |
          set -u
          asset_url="${WORKER_URL}/admin-accounting-settings-comfort.js"
          tmp="$(mktemp)"
          http_code="$(curl -L -sS --connect-timeout 15 --max-time 30 -o "$tmp" -w '%{http_code}' "$asset_url" || true)"
          grup='false'; save='false'; component='false'; preview='false'; pasang='false'; per_option_save='false'
          grep -Fq 'Grup Transaksi' "$tmp" && grup='true'
          grep -Fq 'Simpan Grup' "$tmp" && save='true'
          grep -Fq 'Komponen Grup' "$tmp" && component='true'
          grep -Fq 'data-rule-choice-preview' "$tmp" && preview='true'
          grep -Fq 'Pasang Grup' "$tmp" && pasang='true'
          grep -Fq 'data-save-choice-option' "$tmp" && per_option_save='true'
          hash="$(sha256sum "$tmp" | awk '{print $1}')"
          {
            echo "release_sha=${RELEASE_SHA}"
            echo "asset_url=${asset_url}"
            echo "http_code=${http_code}"
            echo "grup_transaksi=${grup}"
            echo "simpan_grup=${save}"
            echo "komponen_grup=${component}"
            echo "aturan_preview=${preview}"
            echo "pasang_grup_present=${pasang}"
            echo "per_option_save_present=${per_option_save}"
            echo "sha256=${hash}"
          } > live-smoke.txt
          cat live-smoke.txt
          test "$http_code" = "200"
          test "$grup" = "true"
          test "$save" = "true"
          test "$component" = "true"
          test "$preview" = "true"
          test "$pasang" = "false"
          test "$per_option_save" = "false"
      - name: Persist observation on observer branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Karen"
          git config user.email "karen@agent.maxi"
          git add deploy-observation.txt deploy-check-runs.json deploy-github-deployments.json deploy-github-deployment-statuses.jsonl live-smoke.txt
          git commit -m "chore: observe Accounting group UX release 26e3d237" || true
          git push origin HEAD:chore/observe-setting-transaksi-deploy
