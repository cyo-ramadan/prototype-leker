name: Inspect Operational Schema Temp

on:
  push:
    branches:
      - agent/fix-operational-accounting-boundary-20260817

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check source
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Verify operational boundary schema
        shell: bash
        run: |
          node --experimental-sqlite --input-type=module <<'NODE'
          import { readdirSync, readFileSync } from 'node:fs';
          import { DatabaseSync } from 'node:sqlite';
          const db = new DatabaseSync(':memory:');
          db.exec('PRAGMA foreign_keys = ON;');
          for (const file of readdirSync('migrations').filter(name => /^\d{4}_.+\.sql$/.test(name)).sort()) {
            db.exec(readFileSync(`migrations/${file}`, 'utf8'));
          }
          for (const table of ['expenses', 'cost_types']) {
            const forbidden = new Set(['journal_rules','chart_of_accounts','accounting_account_refs','transaction_accounting_mappings']);
            const targets = db.prepare(`PRAGMA foreign_key_list(${table})`).all().map(row => String(row.table));
            const leaked = targets.filter(target => forbidden.has(target));
            if (leaked.length) throw new Error(`${table} still references Accounting tables: ${leaked.join(', ')}`);
            console.log(`${table} foreign keys OK: ${targets.join(', ')}`);
          }
          NODE
