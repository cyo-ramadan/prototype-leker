name: Patch Operational Boundary Docs Temp

on:
  push:
    branches:
      - agent/fix-operational-accounting-boundary-20260817

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply Operasional boundary documentation') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply documentation updates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          pitfalls = Path('KNOWN_PITFALLS.md')
          text = pitfalls.read_text()
          anchor = '## Migration ledger tidak membuktikan schema object lengkap\n'
          block = '''## Operasional tidak boleh memiliki foreign key ke interpretasi Accounting

**Pitfall:** Jangan menyimpan `journalRuleId`, Account ID, atau Accounting mapping identity sebagai foreign key/authority di tabel business application seperti `expenses` atau master Operasional.

**Root cause:** Operasional pernah menyimpan `expenses.accounting_component_rule_id -> journal_rules(id)` dan Cost Master menyimpan dependency yang sama melalui `cost_types.accounting_component_rule_id`. Walaupun jurnal akhirnya tetap diposting oleh Accounting POS Bridge, schema Operasional sudah membawa keputusan interpretasi Accounting ke domain yang salah.

**Prohibited regression behavior:**

- tidak ada tabel business application yang boleh foreign-key langsung ke `journal_rules`, `chart_of_accounts`, `accounting_account_refs`, atau `transaction_accounting_mappings`;
- handler Operasional tidak boleh menerima `journalRuleId`, Account ID, pasangan Debit/Credit, atau fallback account sebagai business input;
- Cost Master/Jenis Biaya tidak boleh menjadi proxy untuk memilih rule/account Accounting;
- jangan membuat resolver/outbox paralel hanya untuk menghindari boundary check.

**Correct pattern:**

- Operasional menyimpan business fact miliknya: jenis/konteks biaya, amount, Qty metadata, payment method, dan business event `EXPENSE`;
- transaksi memakai current canonical shared post-commit Accounting Bridge lane yang juga dipakai SALE/PURCHASE;
- Bridge membaca `transaction_categories`, `journal_rules`, payment mapping, dan Setting Akuntansi lain untuk interpretasi jurnal;
- `transaction_accounting_snapshots` tetap readiness/configuration evidence, bukan pasangan akun tandingan;
- konfigurasi Accounting yang ambigu harus fail closed; Operasional tidak boleh memecahkan ambiguity dengan memilih rule Accounting.

Migration `0038_operational_accounting_boundary.sql` menghapus direct FK tersebut dan menyimpan legacy selector hanya sebagai recovery evidence.

'''
          if block not in text:
            if anchor not in text: raise SystemExit('Known Pitfalls anchor missing')
            pitfalls.write_text(text.replace(anchor, block + anchor, 1))

          runbook = Path('RUNBOOK.md')
          text = runbook.read_text()
          anchor = '## Preview branch rule\n'
          block = '''## Operasional Accounting boundary recovery — 2026-08-17

Change ID: `LEKER-OPS-ACC-BOUNDARY-20260817`.

Migration `0038_operational_accounting_boundary.sql` rebuilds `expenses` and Cost Master type storage to remove direct foreign keys into Accounting-owned `journal_rules`. It preserves the legacy selector columns as nullable TEXT compatibility evidence and snapshots every non-null value into `operational_accounting_boundary_recovery_0038` before the rebuild.

### Pre-migration safety

1. capture the canonical D1 Time Travel checkpoint before applying migration `0038`;
2. do not manually drop/recreate `expenses`, `cost_types`, or Accounting tables from Dashboard/console;
3. run the full migration chain on disposable SQLite first;
4. confirm `cost_masters` remains linked to rebuilt `cost_types` and `expenses.void_permit_id` still references `approval_permits`;
5. do not alter `journal_rules`, Chart of Accounts, or Setting Akuntansi schema as part of this recovery.

### Post-migration verification

Run the repository tests plus direct schema checks:

- `PRAGMA foreign_key_list(expenses)` must contain no `journal_rules`, `chart_of_accounts`, `accounting_account_refs`, or `transaction_accounting_mappings` target;
- apply the same check to `cost_types`;
- `operational_accounting_boundary_recovery_0038` must exist;
- a newly created expense must keep `accounting_component_rule_id = NULL`;
- the corresponding `transaction_accounting_snapshots` row must identify business event `EXPENSE` and transaction category `operational`;
- the committed EXPENSE must still enter the same `attachAccountingBridgeToCommittedResponse(..., 'EXPENSE')` lane as PURCHASE/SALE.

### Rollback / recovery

Primary rollback is D1 Time Travel to the checkpoint captured immediately before migration application.

If row-level investigation is needed without full rollback, use `operational_accounting_boundary_recovery_0038` only as audit/recovery evidence. Do not treat it as a runtime mapping table. A decision to restore the old cross-module FK requires a new governed recovery migration that validates the preserved rule ids and explicitly documents the temporary boundary exception.

'''
          if block not in text:
            if anchor not in text: raise SystemExit('Runbook anchor missing')
            runbook.write_text(text.replace(anchor, block + anchor, 1))

          issues = Path('KNOWN_ISSUES.md')
          text = issues.read_text()
          old = '''### Active: operational component selection

The cashier UI selects one configured Debit expense component by `journalRuleId` without carrying an Account ID. If exactly one active component exists, it is selected automatically. Multiple Debit components require an explicit selection and fail `NEEDS_COMPONENT_SELECTION` when it is absent.
'''
          new = '''### Active: operational business-fact boundary

Cashier Operasional selects a Cost Master / Jenis Biaya business concept and an active payment method. It does not receive or submit `journalRuleId`, Account ID, or Debit/Credit mapping. The committed fact is `EXPENSE` under transaction category `operational`; the shared Accounting POS Bridge resolves journal rules from Setting Akuntansi after commit. Ambiguous Accounting fixed-rule configuration fails closed and must be corrected in Setting Akuntansi rather than resolved by Operasional input.
'''
          if old in text:
            issues.write_text(text.replace(old, new, 1))
          elif new not in text:
            raise SystemExit('Known Issues operational component section missing')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add KNOWN_PITFALLS.md RUNBOOK.md KNOWN_ISSUES.md
          if git diff --cached --quiet; then
            echo 'Documentation already patched.'
            exit 0
          fi
          git commit -m 'Apply Operasional boundary documentation'
          git push origin HEAD:agent/fix-operational-accounting-boundary-20260817
