name: Live Master Barang Diagnostic Temp

on:
  push:
    branches:
      - agent/fix-purchase-master-data-20260816
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect deployed remote schema diagnostic
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://prototype-leker-v2.daily-napkin.workers.dev'
          STATUS="$(curl -sS -o /tmp/schema.json -w '%{http_code}' "$BASE/schema-diagnostic-temp.json")"
          echo "SCHEMA_DIAGNOSTIC_HTTP_STATUS=$STATUS"
          if [ "$STATUS" != '200' ]; then
            cat /tmp/schema.json
            exit 1
          fi
          python - <<'PY'
          import json
          with open('/tmp/schema.json') as f:
              p=json.load(f)
          targets=['products','sales','purchases','expenses']
          for table in targets:
              cols=[x.get('name') for x in p.get('schema',{}).get(table,[])]
              print(f'{table.upper()}_COLUMNS', json.dumps(cols))
          print('MIGRATIONS', json.dumps(p.get('migrations',[]),ensure_ascii=False))
          print('FK_VIOLATIONS', json.dumps(p.get('foreignKeyViolations',[]),ensure_ascii=False))
          PY
