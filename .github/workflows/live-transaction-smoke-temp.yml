name: TEMP Live Transaction API Smoke

on:
  push:
    branches:
      - agent/governance-live-transaction-smoke-20260816
    paths:
      - .github/workflows/live-transaction-smoke-temp.yml
      - scripts/live-d1-diagnostic-temp.mjs
      - src/d1-diagnostic-temp.js
      - src/index.js

permissions:
  contents: read

jobs:
  live-transaction-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect live D1 schema through temporary admin-only diagnostic
        run: node scripts/live-d1-diagnostic-temp.mjs
