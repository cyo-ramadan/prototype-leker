name: Apply Setting Transaksi Fase 3 temp

on:
  push:
    branches:
      - feat/setting-transaksi-resolver-fase3
    paths:
      - scripts/apply-setting-transaksi-fase3-temp.mjs
      - .github/workflows/apply-setting-transaksi-fase3-temp.yml
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/setting-transaksi-resolver-fase3' || github.ref == 'refs/heads/feat/setting-transaksi-resolver-fase3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/setting-transaksi-resolver-fase3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply focused Fase 3 transformation
        run: node scripts/apply-setting-transaksi-fase3-temp.mjs
      - name: Run focused resolver tests
        run: node --test test/choice-groups-resolver.test.js test/accounting-pos-bridge.test.js
      - name: Run full regression suite
        run: npm test
      - name: Run syntax gate
        run: npm run check
      - name: Commit validated implementation and remove bootstrap helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply-setting-transaksi-fase3-temp.mjs .github/workflows/apply-setting-transaksi-fase3-temp.yml
          git config user.name "Karen"
          git config user.email "karen@agent.maxi"
          git add -- src/accounting-pos-bridge.js src/accounting-ledger.js test/choice-groups-resolver.test.js contracts/accounting-choice-groups-v1.md
          git add -u -- scripts/apply-setting-transaksi-fase3-temp.mjs .github/workflows/apply-setting-transaksi-fase3-temp.yml
          git diff --cached --check
          git commit -m "feat(accounting): resolve Setting Transaksi choice groups"
          git push origin HEAD:feat/setting-transaksi-resolver-fase3
