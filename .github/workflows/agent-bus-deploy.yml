name: MAXI Agent Bus CI & Deploy

on:
  pull_request:
    paths:
      - 'agent-bus/**'
      - 'contracts/agent-task-board-v1.md'
      - 'package.json'
      - '.github/workflows/agent-bus-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'agent-bus/**'
      - 'contracts/agent-task-board-v1.md'
      - 'package.json'
      - '.github/workflows/agent-bus-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maxi-agent-bus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Agent Bus Check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: npm run precheck

      - name: Agent Bus tests
        run: node --test agent-bus/test/agent-bus-worker.test.js

  deploy:
    name: Backup, Migrate & Deploy Agent Bus
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_URL: https://maxi-agent-bus-bridge.daily-napkin.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN production secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID production secret"; exit 1; }

      - name: Export remote D1 backup
        run: >-
          npx --yes wrangler d1 export AGENT_BUS --remote
          --config agent-bus/wrangler.jsonc
          --output maxi-agent-bus-before-deploy.sql

      - name: Preserve D1 backup
        uses: actions/upload-artifact@v4
        with:
          name: maxi-agent-bus-before-deploy-${{ github.run_id }}
          path: maxi-agent-bus-before-deploy.sql
          retention-days: 30

      - name: Apply D1 migrations
        run: >-
          npx --yes wrangler d1 migrations apply AGENT_BUS --remote
          --config agent-bus/wrangler.jsonc

      - name: Deploy existing Worker
        run: npx --yes wrangler deploy --config agent-bus/wrangler.jsonc

      - name: Verify Worker version
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$WORKER_URL/health" | grep -q '"version":"1.1.0"'
