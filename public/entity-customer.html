<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pilih Gerai · MAXI Leker</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body{min-height:100vh;background:linear-gradient(145deg,#fff7ed 0%,#fff 48%,#ecfdf5 100%)}
    .entity-customer-shell{width:min(920px,calc(100% - 32px));margin:0 auto;padding:40px 0 64px}
    .entity-customer-brand{display:flex;align-items:center;gap:12px;font-weight:950;letter-spacing:.02em;color:#111827}
    .entity-customer-mark{display:grid;place-items:center;width:44px;height:44px;border-radius:15px;background:#111827;color:#fff;font-size:24px;box-shadow:0 12px 30px rgba(17,24,39,.18)}
    .entity-customer-hero{padding:52px 0 26px}
    .entity-customer-hero h1{max-width:700px;margin:0;font-size:clamp(36px,7vw,68px);line-height:.98;letter-spacing:-.055em;color:#111827}
    .entity-customer-hero p{max-width:620px;margin:18px 0 0;font-size:17px;line-height:1.65;color:#64748b}
    .entity-customer-status{padding:28px;border:1px solid #e2e8f0;border-radius:24px;background:rgba(255,255,255,.84);box-shadow:0 20px 55px rgba(15,23,42,.08)}
    .entity-customer-status h2{margin:0 0 8px;font-size:25px;color:#111827}
    .entity-customer-status p{margin:0;color:#64748b;line-height:1.55}
    .entity-customer-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}
    .entity-customer-store{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:19px;border:1px solid #e2e8f0;border-radius:18px;background:#fff;color:#111827;text-decoration:none;transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}
    .entity-customer-store:hover,.entity-customer-store:focus-visible{transform:translateY(-2px);border-color:#fb923c;box-shadow:0 15px 34px rgba(249,115,22,.12);outline:none}
    .entity-customer-store strong{display:block;font-size:18px}
    .entity-customer-store small{display:block;margin-top:5px;color:#64748b;line-height:1.4}
    .entity-customer-arrow{display:grid;place-items:center;flex:0 0 auto;width:38px;height:38px;border-radius:13px;background:#fff7ed;color:#c2410c;font-size:20px;font-weight:900}
    .entity-customer-error{border-color:#fecaca;background:#fff7f7}
    .entity-customer-error h2{color:#991b1b}
    @media(max-width:650px){.entity-customer-shell{padding-top:24px}.entity-customer-hero{padding-top:40px}.entity-customer-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="entity-customer-shell">
    <div class="entity-customer-brand"><span class="entity-customer-mark">L</span><span>MAXI LEKER</span></div>
    <section class="entity-customer-hero">
      <h1 id="entityCustomerTitle">Pilih gerai tujuanmu.</h1>
      <p>Setiap gerai punya menu dan kotak saran masing-masing. Pilihanmu akan dibawa sampai ke halaman order tanpa perlu login.</p>
    </section>
    <section id="entityCustomerPortal" class="entity-customer-status" aria-live="polite">
      <h2>Menyiapkan daftar gerai...</h2>
      <p>Sebentar ya, kami sedang mencari gerai yang aktif.</p>
    </section>
  </main>
  <script src="/entity-customer.js"></script>
</body>
</html>
