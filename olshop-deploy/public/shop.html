<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAXI Baby Carrier Shop</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="topbar shop-header"><div><span class="eyebrow">Baby Carrier Store</span><h1>MAXI Baby</h1><p>Checkout direct + cashback Rp50.000 setelah order selesai.</p></div><a class="button secondary" href="/admin.html">Admin</a></header>
<main class="shop-layout"><section><div class="section-head"><div><span class="eyebrow">Catalog</span><h2>Gendongan bayi</h2></div><input id="search" placeholder="Cari produk..."></div><div id="catalog" class="product-grid"></div></section><aside class="cart panel"><h2>Cart</h2><div id="cart"></div><div class="form-grid"><input id="customerName" placeholder="Nama customer"><input id="customerPhone" placeholder="No. HP"><select id="channel"><option value="WEB">Website</option><option value="SHOPEE">Shopee</option><option value="TIKTOK">TikTok</option></select><input id="shippingAmount" type="number" min="0" value="0" placeholder="Ongkir"><input id="loyaltyRedeemedAmount" type="number" min="0" value="0" step="1000" placeholder="Pakai cashback"><button id="checkLoyalty" class="button" type="button">Cek Cashback</button><div id="loyaltyInfo" class="notice">Masukkan no. HP untuk cek saldo cashback.</div></div><button id="checkout" class="button full">Checkout</button><p class="muted">Cashback Rp50.000 diberikan satu kali saat order berstatus completed.</p></aside></main><div id="toast" class="toast"></div><script type="module" src="shop.js"></script></body></html>
